{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIBE | Password Changed</title>
    <link rel="icon" type="image/png" href="{% static 'Nibe Limited Logo/NIBE Group Logo.png' %}">
    <link rel="stylesheet" href="{% static 'Investor_Login.css' %}">
</head>
<body>
    <div class="login-page">
        <div class="login-card">

            <div class="login-header">
                <img src="{% static 'Nibe Limited Logo/NIBE Group Logo.png' %}" alt="NIBE Logo" class="login-logo">
                <h1>Password Changed</h1>
                <p>Your password has been updated successfully. You can now log in with your new password.</p>
            </div>

            <div style="text-align:center; margin-top: 24px;">
                <a href="{% url 'dashboard_login' %}" class="login-btn" style="display:inline-block; text-decoration:none;">
                    Go to Login
                </a>
            </div>

        </div>
    </div>
</body>
</html>
