{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIBE | Reset Link Sent</title>
    <link rel="icon" type="image/png" href="{% static 'Nibe Limited Logo/NIBE Group Logo.png' %}">
    <link rel="stylesheet" href="{% static 'Investor_Login.css' %}">
</head>
<body>
    <div class="login-page">
        <div class="login-card">

            <div class="login-header">

            <div class="login-footer" style="margin-top: 24px;">

        </div>
