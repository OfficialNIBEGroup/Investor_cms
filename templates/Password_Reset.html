{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIBE | Forgot Password</title>
    <link rel="icon" type="image/png" href="{% static 'Nibe Limited Logo/NIBE Group Logo.png' %}">
    <link rel="stylesheet" href="{% static 'Investor_Login.css' %}">
</head>
<body>
    <div class="login-page">
        <div class="login-card">

            <div class="login-header">
                <img src="{% static 'Nibe Limited Logo/NIBE Group Logo.png' %}" alt="NIBE Logo" class="login-logo">
                <h1>Forgot Password</h1>
                <p>Enter your email address and we’ll send you a link to reset your password.</p>
            </div>

            <form method="post" class="login-form">
                {% csrf_token %}

                <div class="form-group">
                    <label>Email Address <span>*</span></label>
                    <input type="email" name="email" placeholder="Enter your registered email" required autofocus>
                </div>

                <button type="submit" class="login-btn">Send Reset Link</button>
            </form>

            <div class="login-footer">
                <a href="{% url 'dashboard_login' %}">← Back to Login</a>
            </div>

        </div>
    </div>
</body>
</html>
