{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIBE | Set New Password</title>
    <link rel="icon" type="image/png" href="{% static 'Nibe Limited Logo/NIBE Group Logo.png' %}">
    <link rel="stylesheet" href="{% static 'Investor_Login.css' %}">
</head>
<body>
    <div class="login-page">
        <div class="login-card">

            <div class="login-header">
                <img src="{% static 'Nibe Limited Logo/NIBE Group Logo.png' %}" alt="NIBE Logo" class="login-logo">
                <h1>Set New Password</h1>
                <p>Enter your new password below.</p>
            </div>

            {% if validlink %}
            <form method="post" class="login-form">
                {% csrf_token %}

                <div class="form-group">
                    <label>New Password <span>*</span></label>
                    <input type="password" name="new_password1" placeholder="Enter new password" required>
                </div>

                <div class="form-group">
                    <label>Confirm New Password <span>*</span></label>
                    <input type="password" name="new_password2" placeholder="Confirm new password" required>
                </div>

                <button type="submit" class="login-btn">Change Password</button>
            </form>
            {% else %}
            <p style="text-align:center; color:#64748b; margin: 20px 0;">
                This password reset link is invalid or has expired.
            </p>
            <div class="login-footer">
                <a href="{% url 'password_reset' %}">Request a new link</a>
            </div>
            {% endif %}

        </div>
    </div>
</body>
</html>
