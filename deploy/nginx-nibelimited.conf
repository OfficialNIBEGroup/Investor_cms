# Bind Investor CMS to the public company domains and the VPS IP.
# Copy to: /etc/nginx/sites-available/nibelimited
#
# This file is HTTP-only. The apply script adds a matching 443 server when
# Let's Encrypt certificates are present. Until then, keep any existing
# certbot 443 server, but its /static/ location must use the block below
# (files live in /var/www/investor-cms/static/, not staticfiles/).

upstream investor_cms {
    server 127.0.0.1:8001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.nibelimited.com nibelimited.com 200.97.168.12;

    client_max_body_size 50M;

    # Old bookmarks: https://200.97.168.12/CMS/...
    location = /CMS {
        return 301 /;
    }
    location /CMS/static/ {
        rewrite ^/CMS/static/(.*)$ /static/$1 last;
    }
    location /CMS/media/ {
        rewrite ^/CMS/media/(.*)$ /media/$1 last;
    }
    location /CMS/ {
        rewrite ^/CMS/(.*)$ /$1 permanent;
    }

    # Source files are in ./static/ (not ./staticfiles/). Fall back to Gunicorn/WhiteNoise.
    location /static/ {
        root /var/www/investor-cms;
        try_files $uri @app;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        root /var/www/investor-cms;
        try_files $uri @app;
    }

    location / {
        proxy_pass http://investor_cms;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }

    location @app {
        proxy_pass http://investor_cms;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }
}
