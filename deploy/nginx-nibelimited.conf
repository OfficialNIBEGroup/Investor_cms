# Bind Investor CMS to the public company domains.
# Copy to: /etc/nginx/sites-available/nibelimited
# Enable:  ln -sf /etc/nginx/sites-available/nibelimited /etc/nginx/sites-enabled/nibelimited
#
# Hosts:
#   http://nibelimited.com/
#   https://www.nibelimited.com/
#
# Gunicorn must already listen on 127.0.0.1:8001.
# After copying, run: nginx -t && systemctl reload nginx
# Then (once DNS points here): certbot --nginx -d www.nibelimited.com -d nibelimited.com
# When certbot asks to redirect HTTP to HTTPS, choose "No" so http://nibelimited.com/ stays live.

upstream investor_cms {
    server 127.0.0.1:8001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.nibelimited.com nibelimited.com 200.97.168.12;

    client_max_body_size 50M;

    # Old bookmarks: https://200.97.168.12/CMS/...
    location = /CMS {
        return 301 /;
    }
    location /CMS/ {
        rewrite ^/CMS/(.*)$ /$1 permanent;
    }

    location /static/ {
        alias /var/www/investor-cms/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /var/www/investor-cms/media/;
    }

    location / {
        proxy_pass http://investor_cms;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }
}
